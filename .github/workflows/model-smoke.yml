name: Model smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-smoke
  cancel-in-progress: true

jobs:
  model:
    name: Model
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WEIRWOOD_RUN_MODEL_TESTS: "1"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12.11

      - name: Restore the embedding model cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: bge-small-en-v1.5-5c38ec7c405ec4b44b94cc5a9bb96e735b38267a

      - name: Install Python dependencies
        run: uv sync --locked --dev

      - name: Run the real-model smoke test
        run: uv run pytest -q -m integration
