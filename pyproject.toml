[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weirwood-index"
version = "0.1.0"
description = "Narrative passage retrieval experiments for A Song of Ice and Fire"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0,<3",
    "sentence-transformers>=5.0,<6",
    "torch>=2.0,<3",
]

[project.scripts]
weirwood = "weirwood_index.cli:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]
events = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "spacy>=3.8.11,<3.9",
]
late-interaction = [
    "FlagEmbedding>=1.4,<2",
]

[dependency-groups]
dev = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "fastapi>=0.115,<1",
    "httpx2>=2,<3",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
    "spacy>=3.8.11,<3.9",
    "uvicorn[standard]>=0.30,<1",
]

[tool.uv]
package = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: loads the real local embedding model",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
