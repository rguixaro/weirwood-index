[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weirwood-index"
version = "0.1.0"
description = "Narrative passage retrieval experiments for A Song of Ice and Fire"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
